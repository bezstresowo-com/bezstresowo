services:
  mongodb:
    image: mongo:7
    container_name: bezstresowo-mongodb
    environment:
      MONGO_INITDB_DATABASE: bezstresowo
      MONGO_INITDB_ROOT_USERNAME: bezstresowo
      MONGO_INITDB_ROOT_PASSWORD: supersecret
      TZ: Europe/Warsaw
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --eval "db.adminCommand(\"ping\")" --quiet']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: no

  minio:
    image: minio/minio:latest
    container_name: bezstresowo-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: bezstresowo
      MINIO_ROOT_PASSWORD: supersecret
      TZ: Europe/Warsaw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: no

  minio-createbucket:
    image: minio/mc:latest
    container_name: bezstresowo-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bezstresowo supersecret;
      mc mb --ignore-existing local/s3-bezstresowo;
      mc anonymous set download local/s3-bezstresowo;
      "
    restart: no

volumes:
  mongodb_data:
  minio_data:
