services:
  mongodb:
    image: mongo:7
    container_name: bezstresowo-mongodb
    # Single-node replica set (no auth) — Prisma requires a replica set for
    # transactions (nested writes / $transaction). rs.initiate() runs in mongodb-init.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    environment:
      MONGO_INITDB_DATABASE: bezstresowo
      TZ: Europe/Warsaw
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: no

  mongodb-init:
    image: mongo:7
    container_name: bezstresowo-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    # Idempotently initiate the single-node replica set, then wait for PRIMARY.
    # Member host must be reachable from clients on the host → localhost:27017
    # (the app connects with directConnection=true).
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { if (rs.status().ok) { print("replica set already initiated"); quit(0); } } catch (e) {}
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
          while (!db.hello().isWritablePrimary) { sleep(200); }
          print("replica set ready");
        '
    restart: no

  minio:
    image: minio/minio:latest
    container_name: bezstresowo-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: bezstresowo
      MINIO_ROOT_PASSWORD: supersecret
      TZ: Europe/Warsaw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: no

  minio-createbucket:
    image: minio/mc:latest
    container_name: bezstresowo-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bezstresowo supersecret;
      mc mb --ignore-existing local/s3-bezstresowo;
      mc anonymous set download local/s3-bezstresowo;
      "
    restart: no

volumes:
  mongodb_data:
  minio_data:
