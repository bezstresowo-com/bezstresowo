<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>

		<!-- Font awesome icons -->
		<script src="/fontawesome/fontawesome.min.js"></script>
		<script src="/fontawesome/all.min.js"></script>

		<!--
			`title`, `description` and every `og:` / `twitter:` tag are rendered per
			page and per language through `<Seo />` (`$lib/Seo/Seo.svelte`).
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="roboto scroll-smooth">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
